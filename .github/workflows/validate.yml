name: validate
on:
  push:
    branches: [main, test-ujaira02]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate repository
        run: python tools/validate_release.py
      - name: Test suite (integrity, historical characterisation, revision fixes)
        run: python -m pytest
      - name: Regenerate figure layer with fallback font
        run: python reproduce/figures/run_figures.py --allow-font-fallback
