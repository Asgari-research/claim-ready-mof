name: validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements_historical_unpinned.txt
      - name: Validate repository
        run: python tools/validate_release.py
      - name: Smoke-test historical pipeline
        run: python tools/smoke_test_historical.py
      - name: Regenerate figure layer with fallback font
        run: python reproduce/figures/run_figures.py --allow-font-fallback
